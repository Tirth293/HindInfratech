{% load i18n static %}

<div id="sidebar-overlay"></div>
<aside id="admin-sidebar">

  <!-- Logo -->
  <div class="sidebar-logo">
    <img src="{% static 'images/hind-logo-cropped.png' %}" alt="Hind Infratech" onerror="this.style.display='none'">
    <div class="sidebar-logo-text">
      <span class="brand-name">Hind Infratech</span>
      <span class="brand-sub">Admin Panel</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">

    <!-- Dashboard -->
    <a href="/admin/" class="sidebar-nav-item">
      <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      Dashboard
    </a>

    <!-- Projects -->
    <a href="/admin/projects/project/" class="sidebar-nav-item">
      <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
      </svg>
      Projects
    </a>

    <!-- Gallery -->
    <a href="/admin/gallery/gallery/" class="sidebar-nav-item">
      <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      Gallery
    </a>

    <!-- Logout — POST form required for Django 4.1+ -->
    <div style="margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,0.08);">
      <form method="post" action="{% url 'admin:logout' %}" id="sidebar-logout-form">
        {% csrf_token %}
        <button type="submit" class="sidebar-nav-item sidebar-logout-btn">
          <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Logout
        </button>
      </form>
    </div>

  </nav>

  <div class="sidebar-footer">
    Hind Infratech &copy; {% now "Y" %}
  </div>
</aside>
